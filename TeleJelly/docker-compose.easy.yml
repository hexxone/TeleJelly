name: telejelly-easy

networks:
  telejelly-easy:
    driver: bridge

services:
  jellyfin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOTNET_VERSION: "9.0"
        JELLYFIN_VERSION: "10.11"
    container_name: telejelly-jellyfin
    networks:
      - telejelly-easy
    environment:
      TZ: UTC
    ports:
      - "8096:8096"
    volumes:
      - ./docker-data/jellyfin/config:/config
      - ./docker-data/jellyfin/cache:/cache
      - ./docker-data/downloads:/downloads
      - ./docker-data/library:/media
    depends_on:
      - transmission
      - qbittorrent
      - pyload-ng
      - jdownloader-2
      - fixture-http
    restart: unless-stopped

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: telejelly-transmission
    networks:
      - telejelly-easy
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
      USER: telejelly
      PASS: telejelly
      PEERPORT: 51413
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    volumes:
      - ./docker-data/transmission/config:/config
      - ./docker-data/downloads:/downloads
      - ./docker-data/transmission/watch:/watch
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: telejelly-qbittorrent
    networks:
      - telejelly-easy
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./docker-data/qbittorrent/config:/config
      - ./docker-data/downloads:/downloads
    restart: unless-stopped

  pyload-ng:
    image: lscr.io/linuxserver/pyload-ng:latest
    container_name: telejelly-pyload
    networks:
      - telejelly-easy
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
    ports:
      - "8000:8000"
      - "9666:9666"
    volumes:
      - ./docker-data/pyload/config:/config
      - ./docker-data/downloads:/downloads
    restart: unless-stopped

  jdownloader-2:
    image: jlesage/jdownloader-2:latest
    container_name: telejelly-jdownloader
    networks:
      - telejelly-easy
    environment:
      USER_ID: 1000
      GROUP_ID: 1000
      TZ: UTC
    ports:
      - "5800:5800"
      - "3129:3129"
    volumes:
      - ./docker-data/jdownloader/config:/config:rw
      - ./docker-data/downloads:/downloads:rw
      - ./docker-data/downloads:/output:rw
    restart: unless-stopped

  fixture-http:
    image: nginx:alpine
    container_name: telejelly-fixture-http
    networks:
      - telejelly-easy
    ports:
      - "18080:80"
    volumes:
      - ./docker-data/fixtures/http:/usr/share/nginx/html:ro
    restart: unless-stopped
